[workspace]
members = ["crates/protocol", "crates/driver"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
razer-protocol = { path = "crates/protocol" }
razer-driver = { path = "crates/driver" }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[package]
name = "open-synapse"
version = "0.1.2"
description = "A native control panel for Razer mice"
repository = "https://github.com/Visxoz/open-synapse"
# The device tables are derived from OpenRazer, which is GPL-2.0-or-later.
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dependencies]
razer-protocol = { workspace = true, features = ["serde"] }
razer-driver.workspace = true
log.workspace = true
png = "0.18"
serde.workspace = true
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "accessibility", "compat-1-2", "raw-window-handle-06", "system-tray", "unstable-winit-030"] }
i-slint-backend-winit = "1.18.1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(unix)'.dependencies]
# HTTPS through rustls, whose ring also hashes downloads.
ring = "0.17.14"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString", "NSURL"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.i-slint-renderer-skia]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
