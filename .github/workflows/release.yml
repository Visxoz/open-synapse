# Publishes a release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the version in Cargo.toml. The release holds, for
# Windows, the installer and the portable exe; for Linux, the program and a
# tarball with its udev rule and installer; for macOS, the app zipped and its
# bare program, per architecture; and the SHA-256 sums of all of them, which
# the app's updater checks downloads against. It goes live at once, so every
# copy offers it within twelve hours. Running the workflow by hand only
# builds the files and uploads them as artifacts.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  # Built alongside the checks; publishing waits for both.
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          # The oldest supported runner, so the program runs on older glibc.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "${{ github.event_name }}" = push ] && [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "Cargo.toml says $version but the tag is ${{ github.ref_name }}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev libxkbcommon-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Inno Setup builds the installer into dist/, beside the portable exe.
      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "could not install Inno Setup" }
          }
          # The installer script takes the exe from target/release.
          New-Item -ItemType Directory -Force target/release | Out-Null
          Copy-Item target/${{ matrix.target }}/release/open-synapse.exe target/release/
          & $iscc /Qp "/DAppVersion=$version" installer/open-synapse.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }
          Copy-Item target/release/open-synapse.exe "dist/open-synapse_${version}_x64-portable.exe"

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          name="open-synapse_${{ steps.version.outputs.version }}_linux-x86_64"
          program=target/${{ matrix.target }}/release/open-synapse
          mkdir -p "stage/$name" dist
          cp "$program" packaging/linux/* "stage/$name"
          cp ui/assets/icon.png "stage/$name/open-synapse.png"
          tar -C stage -czf "dist/$name.tar.gz" "$name"
          # The bare program, which the updater fetches.
          cp "$program" "dist/$name"

      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          version="${{ steps.version.outputs.version }}"
          arch="${{ matrix.target }}"
          name="open-synapse_${version}_macos-${arch%%-*}"
          app="dist/Open Synapse.app"
          program=target/${{ matrix.target }}/release/open-synapse
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" icon.iconset
          cp "$program" "$app/Contents/MacOS/"
          sed "s/VERSION/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # Up to the 256 px the icon is drawn at; nothing is scaled up.
          for size in 16 32 128; do
            sips -z $size $size ui/assets/icon.png --out "icon.iconset/icon_${size}x${size}.png" > /dev/null
            sips -z $((size * 2)) $((size * 2)) ui/assets/icon.png --out "icon.iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          cp ui/assets/icon.png icon.iconset/icon_256x256.png
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/icon.icns"
          # Signed ad hoc, as Apple silicon runs nothing unsigned.
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "dist/$name.zip"
          # The bare program, as the linker signed it rather than bound to this
          # app's Info.plist; the updater puts it in place of the app's own and
          # signs the app again.
          cp "$program" "dist/$name"
          rm -r "$app"

      - uses: actions/upload-artifact@v7
        with:
          name: open-synapse-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: dist/open-synapse_*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: open-synapse-*
          path: dist
          merge-multiple: true

      # The app's updater checks its download against these.
      - name: Sum the files
        working-directory: dist
        run: sha256sum open-synapse_* > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)
          bash scripts/release-notes.sh "$previous" "$TAG" > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Open Synapse $TAG" --notes-file notes.md \
            dist/open-synapse_* dist/SHA256SUMS
