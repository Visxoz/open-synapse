# Publishes a release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the version in Cargo.toml. The release holds the
# installer, the portable exe and their SHA-256 sums, which the app's updater
# checks downloads against, and goes live at once, so every copy offers it
# within twelve hours. Running the workflow by hand only builds the files and
# uploads them as an artifact.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  # Built alongside the checks; publishing waits for both.
  build:
    name: Build exe and installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.event_name }}" -eq "push" -and "v$version" -ne "${{ github.ref_name }}") {
            throw "Cargo.toml says $version but the tag is ${{ github.ref_name }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      # Inno Setup builds the installer into dist/, beside the portable exe.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "could not install Inno Setup" }
          }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.version }}" installer/open-synapse.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Copy-Item target/release/open-synapse.exe "dist/open-synapse_${version}_x64-portable.exe"
          # The app's updater checks its download against these.
          (Get-ChildItem dist/*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }) -join "`n" | Set-Content -NoNewline -Encoding ascii dist/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: open-synapse-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: open-synapse-${{ needs.build.outputs.version }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)
          bash scripts/release-notes.sh "$previous" "$TAG" > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Open Synapse $TAG" --notes-file notes.md \
            dist/*.exe dist/SHA256SUMS
